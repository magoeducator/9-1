<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>손해보험·제3보험 실전모의고사 9-1형</title>
<style>
:root{--orange:#f37021;--navy:#182638;--ink:#18212b;--muted:#667085;--line:#e4e7ec;--paper:#fff;--bg:#f5f7fa;--green:#087443;--green-bg:#e9f8ef;--red:#b42318;--red-bg:#fff0ef;}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic",sans-serif}button,input{font:inherit}button{cursor:pointer;border:0}.screen{display:none;min-height:100vh}.screen.active{display:block}.wrap{width:min(100%,760px);margin:0 auto;padding:24px 16px 42px}.brand{color:var(--orange);font-size:13px;font-weight:800;letter-spacing:.02em}.title{margin:8px 0 10px;color:var(--navy);font-size:clamp(25px,6vw,38px);line-height:1.25;letter-spacing:-.05em}.desc{margin:0;color:var(--muted);line-height:1.65}.card{margin-top:22px;padding:20px;border:1px solid var(--line);border-radius:18px;background:var(--paper);box-shadow:0 8px 24px #1d293908}.field-label{display:block;margin-bottom:8px;color:var(--navy);font-size:14px;font-weight:800}.name-input{width:100%;height:50px;padding:0 14px;border:1px solid #cfd5dd;border-radius:10px;outline:none}.name-input:focus{border-color:var(--orange);box-shadow:0 0 0 3px #f26a2120}.mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.mode-btn{min-height:98px;padding:14px 10px;border:1px solid #d9dee7;border-radius:14px;background:#fff;text-align:left;color:var(--navy);font-weight:800}.mode-btn small{display:block;margin-top:7px;color:var(--muted);font-size:12px;font-weight:500;line-height:1.35}.mode-btn:hover,.mode-btn:focus-visible{border-color:var(--orange);background:#fff8f4}.notice{margin-top:15px;padding:12px 14px;border-radius:11px;background:#fff5ed;color:#8a3c16;font-size:13px;line-height:1.55}.primary{width:100%;min-height:50px;padding:12px 16px;border-radius:11px;background:var(--orange);color:#fff;font-weight:800}.primary:disabled{opacity:.45;cursor:not-allowed}.secondary{min-height:44px;padding:10px 14px;border:1px solid #d5dbe4;border-radius:10px;background:#fff;color:var(--navy);font-weight:750}.danger{border-color:#f0b6b0;color:var(--red);background:#fffafa}.button-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.button-row>*{flex:1 1 150px}.test-top{position:sticky;top:0;z-index:2;border-bottom:1px solid var(--line);background:#ffffffef;backdrop-filter:blur(10px)}.test-top-inner{width:min(100%,760px);margin:0 auto;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}.mode-label{font-size:13px;font-weight:800;color:var(--navy)}.progress{margin-top:4px;color:var(--muted);font-size:12px}.quit{padding:8px 0;background:none;color:var(--muted);font-size:12px}.test-wrap{padding-top:18px}.question-card{padding:20px 17px 17px;border:1px solid var(--line);border-radius:18px;background:#fff}.q-kicker{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--orange);font-size:14px;font-weight:850}.points{color:var(--muted);font-size:12px;font-weight:700}.question{margin:14px 0 18px;white-space:pre-line;font-size:19px;line-height:1.72;letter-spacing:-.03em;font-weight:760}.choices{display:grid;gap:10px}.choice{display:flex;align-items:flex-start;gap:11px;width:100%;padding:14px 13px;border:1px solid #dbe0e8;border-radius:12px;background:#fff;color:var(--ink);text-align:left;line-height:1.55;white-space:pre-line}.choice.selected{border-color:var(--orange);background:#fff7f2;box-shadow:0 0 0 1px var(--orange)}.choice input{margin-top:4px;accent-color:var(--orange);flex:0 0 auto}.choice-text{flex:1}.test-error{min-height:22px;margin-top:10px;color:var(--red);font-size:13px}.test-actions{display:flex;gap:10px;margin-top:14px}.test-actions button{flex:1;min-height:48px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:18px}.stat{padding:15px 10px;border:1px solid var(--line);border-radius:13px;background:#fff;text-align:center}.stat strong{display:block;color:var(--navy);font-size:22px}.stat span{display:block;margin-top:4px;color:var(--muted);font-size:12px}.result-title{margin-bottom:4px}.share{width:100%;min-height:150px;margin-top:16px;padding:13px;border:1px solid var(--line);border-radius:12px;resize:vertical;background:#fcfcfd;color:#344054;line-height:1.5}.review-card{padding:18px 16px;border:1px solid var(--line);border-radius:18px;background:#fff}.review-question{margin:12px 0 16px;white-space:pre-line;font-size:18px;line-height:1.65;font-weight:760}.review-choice{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid #e0e4ea;border-radius:10px;line-height:1.5;white-space:pre-line}.review-choice+.review-choice{margin-top:8px}.review-choice.correct{border-color:#7ac99a;background:var(--green-bg);color:var(--green)}.review-choice.wrong{border-color:#edaaa4;background:var(--red-bg);color:var(--red)}.review-choice.neutral{color:#475467}.mark{flex:0 0 22px;height:22px;display:grid;place-items:center;border-radius:50%;background:#eef1f5;color:#475467;font-size:12px;font-weight:800}.correct .mark{background:#b6e8c8;color:var(--green)}.wrong .mark{background:#f8c5bf;color:var(--red)}.explanation{margin-top:16px;padding:14px;border-left:4px solid var(--orange);border-radius:0 10px 10px 0;background:#fff8f4;line-height:1.6}.explanation strong{display:block;margin-bottom:5px;color:#8a3c16;font-size:13px}.explanation span{font-size:14px;white-space:pre-line}.review-nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}.review-nav button{flex:1;min-height:48px}.empty{padding:18px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--muted);line-height:1.6}.footnote{margin-top:16px;color:var(--muted);font-size:12px;line-height:1.55}@media(max-width:520px){.wrap{padding:20px 13px 34px}.mode-grid{grid-template-columns:1fr}.mode-btn{min-height:70px}.mode-btn small{display:inline;margin-left:6px}.question-card{padding:17px 13px 14px}.question{font-size:17px}.summary{gap:6px}.stat{padding:12px 6px}.stat strong{font-size:20px}}
</style>
</head>
<body>
<main id="app">
<section id="startScreen" class="screen active">
  <div class="wrap">
    <div class="brand">손해보험 · 제3보험 모집인 등록자격시험</div>
    <h1 class="title">실전모의고사<br>2026 개정판 9-1형</h1>
    <p class="desc">문제지 원문 기준 50문항입니다. 이름을 입력하고 응시 범위를 선택하세요.</p>
    <div class="card">
      <label class="field-label" for="nameInput">응시자 이름</label>
      <input id="nameInput" class="name-input" type="text" autocomplete="name" placeholder="이름을 입력하세요">
      <div class="field-label" style="margin-top:20px">응시 범위</div>
      <div class="mode-grid">
        <button class="mode-btn" data-mode="all">전체 1~50<small>총 151점</small></button>
        <button class="mode-btn" data-mode="damage">손해보험 1~33<small>총 100점</small></button>
        <button class="mode-btn" data-mode="third">제3보험 18~50<small>총 100점</small></button>
      </div>
      <div class="notice">18번은 문제지 표기대로 4점이며, 나머지 문항은 3점입니다. 제출 전까지 이전 문항으로 이동할 수 있습니다.</div>
    </div>
  </div>
</section>

<section id="testScreen" class="screen">
  <div class="test-top"><div class="test-top-inner"><div><div id="modeLabel" class="mode-label"></div><div id="progress" class="progress"></div></div><button id="quitButton" class="quit">처음으로</button></div></div>
  <div class="wrap test-wrap"><div class="question-card"><div class="q-kicker"><span id="questionNo"></span><span id="points" class="points"></span></div><div id="questionText" class="question"></div><div id="choices" class="choices"></div><div id="testError" class="test-error" aria-live="polite"></div><div class="test-actions"><button id="prevButton" class="secondary">이전</button><button id="nextButton" class="primary">다음</button></div></div><p class="footnote">정답을 선택하면 자동 저장됩니다. 최종 문항에서만 제출할 수 있습니다.</p></div>
</section>

<section id="resultScreen" class="screen"><div class="wrap"><div class="brand">채점 완료</div><h1 id="resultTitle" class="title result-title">결과</h1><p id="resultSub" class="desc"></p><div class="summary"><div id="damageStat" class="stat"><strong id="damageScoreValue">-/100</strong><span>손해보험</span><small id="damageDetail"></small></div><div id="thirdStat" class="stat"><strong id="thirdScoreValue">-/100</strong><span>제3보험</span><small id="thirdDetail"></small></div><div id="overallStat" class="stat"><strong id="overallValue">-</strong><span>최종 결과</span><small id="overallDetail">두 과목 모두 60점 이상 합격</small></div></div><div id="resultCard" class="card"><div id="resultMessage" class="desc"></div><textarea id="shareText" class="share" readonly onclick="this.select();" aria-label="결과 공유 문구"></textarea><div class="button-row"><button id="copyButton" class="secondary">결과 문구 복사</button><button id="reviewButton" class="primary">문제·해설 확인</button></div><div id="retryButtons" class="button-row" style="display:none"><button id="wrongRetryButton" class="secondary">틀린 문제만 재시험</button><button id="fullRetryButton" class="secondary">범위 전체 다시 풀기</button><button id="homeButton" class="danger">처음으로</button></div></div></div></section>

<section id="reviewScreen" class="screen"><div class="wrap"><div class="brand">문제·해설 확인</div><h1 class="title result-title">오답을 점검하세요</h1><p id="reviewSub" class="desc"></p><div class="review-card"><div class="q-kicker"><span id="reviewNo"></span><span id="reviewState" class="points"></span></div><div id="reviewQuestion" class="review-question"></div><div id="reviewChoices"></div><div class="explanation"><strong>해설</strong><span id="reviewExplanation"></span></div><div class="review-nav"><button id="reviewPrev" class="secondary">이전</button><button id="reviewNext" class="primary">다음 해설</button></div></div></div></section>
</main>
<script>
const questions = [
  {"n":1,"q":"다음 표의 (   ) 안에 들어갈 알맞은 숫자는?\n\n피난손해는 피난지에서 (   )일 이내에 발생한\n직접손해 및 소방손해를 말한다","c":["3","5","7","10"],"a":2,"e":"피난손해에 대한 설명임"},
  {"n":2,"q":"일반화재보험에서 보상하지 않는 손해는?","c":["폭발 또는 파열로 인한 손해","화재로 인한 재산손해","화재진압 과정에서 발생한 소방손해","벼락으로 인한 손해"],"a":1,"e":"일반화재보험에서는 폭발 또는 파열에 따른 직접손해는 보상하지 않고, 주택화재보험에서만 보상함"},
  {"n":3,"q":"특수건물화재보험 신체손해배상책임담보 특별약관에서 보상하는 손해에 해당하는 것은?","c":["피보험자의 재산손해","제3자가 사망 · 부상 · 장해를 입은 경우","직계가족이 입은 신체손해","화재로 인한 대물손해"],"a":2,"e":"특수건물의 소유자 및 주거를 같이 하는 직계가족 이외의 제3자의 신체손해에 따른 피보험자의 (법률상) 손해배상책임에 따라 부담하여야 하는 손해를 보상함"},
  {"n":4,"q":"다음의 배상책임보험 중 전문(직업)인 배상책임보험에 해당하는 것은?","c":["시설소유관리자배상책임보험","도급업자배상책임보험","생산물배상책임보험","의사(병원)배상책임보험"],"a":4,"e":"전문인 배상책임보험은 의사(병원), 회계사, 건축사, 변호사 등을 대상으로 함"},
  {"n":5,"q":"여행보험의 특별약관에서 보상하지 않는 손해에 해당하는 것은?","c":["휴대품 분실","후유장해","질병사망","배상책임"],"a":1,"e":"분실손해는 보상하지 않는 손해임"},
  {"n":6,"q":"장기손해보험에 적용되는 제도에 대한 설명으로 틀린 것은?","c":["자동복원제도","보험계약의 부활제도","환급금 지급제도","저축보험료의 일반계정 운용"],"a":4,"e":"장기손해보험의 저축보험료를 특별계정에서 운용하는 이유는 저축성보험은 계약자의 보험료가 금융자산의 성격을 갖기 때문임"},
  {"n":7,"q":"장기화재보험에서 자동복원제도가 적용되기 위한 1회 사고시 지급하는 보험금의 한도는?","c":["보험가액의 80% 미만일 경우","보험가액의 85% 미만일 경우","보험가입금액의 80% 미만일 경우","보험가입금액의 85% 미만일 경우"],"a":3,"e":"자동복원제도가 복원되기 위해서는 1회 사고시 지급보험금이 보험가입금액의 80% 미만이어야 함"},
  {"n":8,"q":"장기화재보험에서 보상하지 않는 손해에 해당하는 것은?","c":["보험목적의 자연발열, 자연발화","화재에 따른 직접손해","소방손해","잔존물 제거비용 등 계약자가 지출한 비용"],"a":1,"e":"보험목적의 자연소모는 보상하지 않는 손해에 해당함"},
  {"n":9,"q":"장기손해보험의 보험금 지급사유별 지급기간의 연결이 옳지 않은 것은?","c":["상해보험금\n- 청구서류를 접수한 날로부터 3영업일 이내","질병보험금\n- 청구서류를 접수한 날로부터 7영업일 이내","재산손해보험금\n- 지급 보험금이 결정된 후 7영업일 이내","배상책임보험금\n- 지급 보험금이 결정된 후 7영업일 이내"],"a":2,"e":"7영업일 → 3영업일, 신체손해보험금은 3영업일 이내임"},
  {"n":10,"q":"연금계좌에서 인출하는 연간 연금수령금액이 1,500만원을 초과하는 경우 적용되는 분리과세 세율은?(지방소득세 포함)","c":["13.2%","15.4%","16.5%","22.0%"],"a":3,"e":"연간 연금수령액이 1,500만원을 초과할시 종합과세 또는 16.5%(지방소득세 포함) 분리과세 중 선택할 수 있음"},
  {"n":11,"q":"보험계약자 또는 피보험자가 보험사고 발생시 손해가 확대되지 않도록 적극적으로 힘써야 하는 의무는 무엇인가?","c":["손해방지의무","손해발생 통지의무","위험유지의무","위험변경 · 증가 통지의무"],"a":1,"e":"손해방지의무에 대한 설명임"},
  {"n":12,"q":"자동차보험의 특성과 거리가 먼 것은?","c":["위험분산","사고예방","경제적 구제","보험료 일시납"],"a":4,"e":"자동차보험의 보험료 일시납은 자동차보험의 특성과는 관련이 없음"},
  {"n":13,"q":"자동차손해배상보장법상의 자동차 관련 주요 용어에 대한 설명으로 틀린 것은?","c":["자동차는 자동차관리법상의 자동차와 건설기계관리법상의 9종 건설기계를 의미한다","운행자는 자동차를 그 용법에 따라 사용 또는 관리하는 자이다","이륜자동차는 자동차에 해당하지 않는다","운전자는 다른 사람을 위하여 자동차의 운전이나 운전의 보조에 종사하는 자이다"],"a":3,"e":"이륜자동차는 자동차관리법상 자동차에 해당함"},

function bootMarker(){}
const $ = id => document.getElementById(id);
const screens = {start:$('startScreen'),test:$('testScreen'),result:$('resultScreen'),review:$('reviewScreen')};
let state = {name:'',mode:'all',queue:[],index:0,answers:new Map(),lastResult:null,reviewIndex:0,reviewed:false,retry:false};
const modeNames = {all:'전체 1~50',damage:'손해보험 1~33',third:'제3보험 18~50'};
const modeRanges = {all:[1,50],damage:[1,33],third:[18,50]};
function weight(q){return q.n===18?4:3}
function show(which){Object.values(screens).forEach(s=>s.classList.remove('active'));screens[which].classList.add('active');window.scrollTo({top:0,behavior:'instant'})}
function rangeFor(mode){const [from,to]=modeRanges[mode];return questions.filter(q=>q.n>=from&&q.n<=to)}
function begin(mode, retryQueue){
  const name = $('nameInput').value.trim();
  if(!name){$('nameInput').focus();$('nameInput').setAttribute('aria-invalid','true');return}
  const previous=state.lastResult;const fullRange=retryQueue&&previous?[...previous.scoreRange]:rangeFor(mode);const activeQueue=retryQueue?[...retryQueue]:[...fullRange];const preserved=new Map();if(retryQueue&&previous){previous.answers.forEach((answer,n)=>preserved.set(n,answer));retryQueue.forEach(q=>preserved.delete(q.n))}
  state={name,mode,queue:activeQueue,scoreRange:fullRange,index:0,answers:preserved,lastResult:null,reviewIndex:0,reviewed:false,retry:Boolean(retryQueue)};
  $('modeLabel').textContent=modeNames[mode]+(state.retry?' · 틀린 문제 재시험':'');show('test');renderQuestion();
}
function renderQuestion(){
  const q=state.queue[state.index]; if(!q)return;
  $('questionNo').textContent=`${q.n}번`;$('points').textContent=`${weight(q)}점`;
  $('progress').textContent=`${state.index+1} / ${state.queue.length}`;$('questionText').textContent=q.q;
  const selected=state.answers.get(q.n);const box=$('choices');box.innerHTML='';
  q.c.forEach((choice,i)=>{const label=document.createElement('label');label.className='choice'+(selected===i+1?' selected':'');const radio=document.createElement('input');radio.type='radio';radio.name='answer';radio.value=i+1;radio.checked=selected===i+1;radio.addEventListener('change',()=>{state.answers.set(q.n,i+1);$('testError').textContent='';renderQuestion()});const span=document.createElement('span');span.className='choice-text';span.textContent=`${i+1}. ${choice}`;label.append(radio,span);box.append(label)});
  $('prevButton').disabled=state.index===0;$('nextButton').textContent=state.index===state.queue.length-1?'제출하고 채점':'다음';$('testError').textContent='';
}
function next(){const q=state.queue[state.index];if(!state.answers.has(q.n)){$('testError').textContent='답을 선택한 뒤 진행하세요.';return}if(state.index<state.queue.length-1){state.index++;renderQuestion()}else finish()}
function prev(){if(state.index>0){state.index--;renderQuestion()}}
function subjectResult(range,answers){const max=range.reduce((s,q)=>s+weight(q),0);const correct=range.filter(q=>answers.get(q.n)===q.a).length;const score=range.reduce((s,q)=>s+(answers.get(q.n)===q.a?weight(q):0),0);return {count:range.length,correct,score,max,rate:Math.round(correct/range.length*100),passed:score>=60}}
function finish(){const wrong=state.queue.filter(q=>state.answers.get(q.n)!==q.a);const correct=state.queue.length-wrong.length;const damage=subjectResult(questions.filter(q=>q.n>=1&&q.n<=33),state.answers);const third=subjectResult(questions.filter(q=>q.n>=18&&q.n<=50),state.answers);state.lastResult={queue:[...state.queue],scoreRange:[...state.scoreRange],answers:new Map(state.answers),wrong,correct,subjectScores:{damage,third}};state.reviewIndex=0;state.reviewed=false;renderResult();show('result')}
function passText(subject){return subject.passed?'합격':'불합격'}
function makeShare(){const r=state.lastResult;const d=r.subjectScores.damage;const t=r.subjectScores.third;const wrong=r.wrong.map(q=>q.n).join(', ')||'없음';const subjectLines=state.mode==='all'?`손해보험: ${d.score}/100점 (${d.correct}/${d.count}, ${d.rate}%) · ${passText(d)}\n제3보험: ${t.score}/100점 (${t.correct}/${t.count}, ${t.rate}%) · ${passText(t)}\n최종 결과: ${d.passed&&t.passed?'최종 합격':'최종 불합격'}`:state.mode==='damage'?`손해보험: ${d.score}/100점 (${d.correct}/${d.count}, ${d.rate}%) · ${passText(d)}`:`제3보험: ${t.score}/100점 (${t.correct}/${t.count}, ${t.rate}%) · ${passText(t)}`;return `손해보험·제3보험 실전모의고사 9-1형\n응시자: ${state.name}\n범위: ${modeNames[state.mode]}${state.retry?' (틀린 문제 재시험)':''}\n${subjectLines}\n오답 문항: ${wrong}`}
function renderSubjectStat(statId,scoreId,detailId,subject){$(statId).style.display=(state.mode==='all'||(state.mode==='damage'&&statId==='damageStat')||(state.mode==='third'&&statId==='thirdStat'))?'':'none';$(scoreId).textContent=`${subject.score}/${subject.max}`;$(`${detailId}`).textContent=`${subject.correct}/${subject.count} · ${subject.rate}% · ${passText(subject)}`}
function renderResult(){const r=state.lastResult;const d=r.subjectScores.damage;const t=r.subjectScores.third;$('resultTitle').textContent=state.retry?'재시험 결과':'채점 결과';$('resultSub').textContent=`${state.name}님 · ${modeNames[state.mode]} · ${r.queue.length}문항${state.retry?' 재시험':''}`;renderSubjectStat('damageStat','damageScoreValue','damageDetail',d);renderSubjectStat('thirdStat','thirdScoreValue','thirdDetail',t);$('overallStat').style.display=state.mode==='all'?'':'none';$('overallValue').textContent=d.passed&&t.passed?'최종 합격':'최종 불합격';$('overallDetail').textContent=`손해보험 ${passText(d)} · 제3보험 ${passText(t)}`;$('shareText').value=makeShare();$('resultMessage').textContent=state.reviewed?'두 과목별 점수와 합격 여부를 확인했습니다. 원하는 방식으로 다시 응시할 수 있습니다.':'문제·해설을 끝까지 확인하면 오답 재시험 메뉴가 열립니다.';$('reviewButton').style.display=state.reviewed?'none':'';$('retryButtons').style.display=state.reviewed?'flex':'none';$('wrongRetryButton').disabled=!r.wrong.length;$('wrongRetryButton').textContent=r.wrong.length?`틀린 문제만 재시험 (${r.wrong.length})`:'틀린 문제가 없습니다'}
function startReview(){state.reviewIndex=0;show('review');renderReview()}
function renderReview(){const r=state.lastResult;const q=r.queue[state.reviewIndex];const selected=r.answers.get(q.n);$('reviewSub').textContent=`${state.reviewIndex+1} / ${r.queue.length} · 정답과 해설을 확인하세요`;$('reviewNo').textContent=`${q.n}번 · ${weight(q)}점`;$('reviewState').textContent=selected==null?'미응답':selected===q.a?'정답':'오답';$('reviewQuestion').textContent=q.q;const box=$('reviewChoices');box.innerHTML='';q.c.forEach((choice,i)=>{const row=document.createElement('div');const isCorrect=i+1===q.a;const isWrong=selected===i+1&&selected!==q.a;row.className='review-choice '+(isCorrect?'correct':isWrong?'wrong':'neutral');const mark=document.createElement('span');mark.className='mark';mark.textContent=isCorrect?'⭕':isWrong?'❌':String(i+1);const text=document.createElement('span');text.textContent=`${i+1}. ${choice}${isCorrect?'  (정답)':isWrong?'  (선택)':''}`;row.append(mark,text);box.append(row)});$('reviewExplanation').textContent=q.e;$('reviewPrev').disabled=state.reviewIndex===0;$('reviewNext').textContent=state.reviewIndex===r.queue.length-1?'오답학습 완료 → 최종 결과':'다음 해설'}
function finishReview(){state.reviewed=true;renderResult();show('result')}
function retryWrong(){const wrong=state.lastResult.wrong;if(wrong.length)begin(state.mode,wrong)}
function retryFull(){begin(state.mode)}
function home(){state={name:'',mode:'all',queue:[],index:0,answers:new Map(),lastResult:null,reviewIndex:0,reviewed:false,retry:false};$('nameInput').value='';show('start')}
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>begin(b.dataset.mode)));
$('nextButton').addEventListener('click',next);$('prevButton').addEventListener('click',prev);$('reviewButton').addEventListener('click',startReview);$('reviewPrev').addEventListener('click',()=>{if(state.reviewIndex>0){state.reviewIndex--;renderReview()}});$('reviewNext').addEventListener('click',()=>{if(state.reviewIndex<state.lastResult.queue.length-1){state.reviewIndex++;renderReview()}else finishReview()});$('wrongRetryButton').addEventListener('click',retryWrong);$('fullRetryButton').addEventListener('click',retryFull);$('homeButton').addEventListener('click',home);$('quitButton').addEventListener('click',()=>{if(confirm('현재 응시를 중단하고 처음으로 돌아갈까요?'))home()});$('copyButton').addEventListener('click',async()=>{const t=$('shareText').value;try{await navigator.clipboard.writeText(t);$('copyButton').textContent='복사 완료'}catch{$('shareText').focus();$('shareText').select();document.execCommand('copy');$('copyButton').textContent='복사 완료'}setTimeout(()=>$('copyButton').textContent='결과 문구 복사',1600)});$('nameInput').addEventListener('input',e=>e.target.removeAttribute('aria-invalid'));
</script>
